version: "3.8"

services:
  app:
    image: ademdev/qr-absen-api:1.0.0
    container_name: qr-backend
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
